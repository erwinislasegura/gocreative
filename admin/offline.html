<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Sin conexión | Go Creative Admin</title>
  <style>
    *{box-sizing:border-box}body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;margin:0;padding:24px;color:#07111f;background:#f4f6f2;font-family:Inter,"Segoe UI",Arial,sans-serif}.card{width:min(100%,440px);padding:28px;background:#fbfdfb;border:1px solid #d9e1dc;box-shadow:0 18px 44px rgba(7,17,31,.08)}.icon{display:grid;place-items:center;width:58px;height:58px;margin-bottom:22px;color:#8bea38;background:#07111f;font-size:.85rem;font-weight:900}small{color:#26945e;font-size:.65rem;font-weight:850;letter-spacing:.13em;text-transform:uppercase}h1{margin:8px 0 10px;font-size:1.65rem;letter-spacing:-.04em}p{margin:0 0 22px;color:#66747b;font-size:.86rem;line-height:1.55}button{width:100%;min-height:48px;color:#07111f;background:#8bea38;border:0;font-weight:850;touch-action:manipulation}
  </style>
</head>
<body>
  <main class="card">
    <span class="icon">GC</span>
    <small>Aplicación administrativa</small>
    <h1>Estás sin conexión</h1>
    <p>Por seguridad los datos privados no se guardan en el teléfono. Recupera la conexión para volver a cargar el panel.</p>
    <button type="button" onclick="location.reload()">Intentar nuevamente</button>
  </main>
</body>
</html>
